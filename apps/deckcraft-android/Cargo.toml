[package]
name = "deckcraft-android"
description = "DeckCraft's Android entry point: the NativeActivity android_main trampoline that opens the shared app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# NativeActivity loads this library and calls its android_main.
crate-type = ["cdylib"]

# This crate deliberately does not inherit the workspace lints. Android's NativeActivity ABI
# requires an unmangled android_main export, and on edition 2024 that spelling
# (`#[unsafe(no_mangle)]`) trips rust's `unsafe_code` lint, which the workspace forbids — there is
# no safe spelling of a required export symbol. It therefore sets the workspace's *clippy* denials
# itself (every one of them) and leaves `unsafe_code` alone. The shared app it opens keeps the
# workspace lints unchanged.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[dependencies]
deckcraft = { path = "../deckcraft" }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# The NativeActivity handle the app's event loop needs; the same 0.6 instance eframe and winit
# use, so the handle passes across crates as one type.
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
# JNI over the activity's JVM, for the "All files access" grant check and ask (android_access).
jni = "0.21"

[package.metadata.android]
package = "ai.storyteller.deckcraft"
apk_name = "deckcraft"
build_targets = ["aarch64-linux-android"]
# The launcher icon tree (five densities, rendered by `cargo xtask mipmaps`): cargo-apk packs it
# with `aapt package -S res`, so every file must be named exactly ic_launcher.png.
resources = "res"

# The shared-storage permissions (spec D). Declaring them grants nothing by itself: "All files
# access" is toggled by the user on the settings page android_access opens, and the legacy runtime
# permissions apply only below Android 10 (scoped storage in between opened no shared tree).
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 36

[package.metadata.android.application]
label = "DeckCraft"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
# The mipmap tree above: Android picks the right density for the launcher.
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
# Every configuration change the activity handles itself instead of a restart (the same list the
# other Craft apps' Android builds use): the window, the documents and the app survive rotating
# the device, folding and unfolding it, a theme switch, a font-scale change, a different keyboard
# or locale. Restarting would drop winit's queued lifecycle and input callbacks mid-show.
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|keyboard|navigation|touchscreen|locale|mcc|mnc|colorMode"
label = "DeckCraft"
launch_mode = "singleTask"
# A presentation is authored landscape, like PowerPoint on the tablets this runs on; the canvas
# keeps the room it wants when the device turns.
orientation = "landscape"
exported = true
