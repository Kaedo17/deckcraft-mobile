[package]
name = "deckcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft app library; the desktop binary is a shim over it"
publish = false
default-run = "deckcraft"

[lib]
# The binary (main.rs) is a shim; the window and launch logic live in lib.rs so another host
# (Android's NativeActivity entry point, a later step) opens the same app.
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
deckcraft-media = { workspace = true }
# The features every host shares. The desktop-only extras live in the desktop target block below:
# AccessKit and the OS clipboard have no Android backend, and Wayland/X11 don't exist on a phone.
# Android selects its NativeActivity backend in its own block.
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for deckcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
# Media output through cpal; Android's AAudio backend is pure Rust bindings, so the phone keeps sound.
cpal = "0.16"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
# Native file dialogs (Open, Save As, pick picture/audio/video/theme): rfd does not compile for
# Android; there the dialog requests answer cancelled until the in-app file browser (a later step).
rfd = { workspace = true }
# The system clipboard beyond egui's text (pictures, HTML): arboard has no Android backend either.
arboard = { workspace = true, features = ["image-data"] }
image = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# `clipboard` is the OS clipboard (Ctrl+C/X/V with other apps). Without it egui simulates one inside
# the app; the egui 0.37 migration (#1350) dropped it from this list. AccessKit speaks to screen
# readers through desktop backends and `links` opens browser windows; neither exists on Android.
eframe = { workspace = true, features = ["accesskit", "clipboard", "links", "wayland", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
# The NativeActivity backend eframe drives its Android event loop with. android-activity 0.6 is
# what winit re-exports, so the handle eframe needs is the same type the entry crate hands over.
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
eframe = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click, Open With, Dock drops and `open -a DeckCraft deck.pptx` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used by
# GridCraft, PdfCraft and PhotoCraft) registers the handler (Objective-C interop needs unsafe, which
# our workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
# X11 display listing and the forced-X11 event loop (see lib.rs); neither exists on Android.
winit = { version = "0.30", default-features = false, features = ["x11"] }
